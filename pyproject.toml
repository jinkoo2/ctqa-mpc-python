[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctqa-mpc"
version = "0.1.1"
description = "Python port of MPC CT geometry QA (CTQA-MPC)"
requires-python = ">=3.10"
dependencies = [
    "SimpleITK>=2.3",
    "numpy",
    "pydicom",
    "watchdog",
    "PyQt5",
]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PyQt5"]
build = ["pyinstaller>=6", "build"]

[project.scripts]
ctqa-mpc = "ctqa_mpc.cli:main"

[tool.setuptools.packages.find]
include = ["ctqa_mpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
